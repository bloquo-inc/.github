name: Sync Copilot Instructions

on:
  push:
    branches: [main]
    paths:
      - copilot-instructions.md
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

jobs:
  sync:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Sync to all org repos
        env:
          GH_TOKEN: ${{ secrets.SYNC_TOKEN }}
          ORG: ${{ github.repository_owner }}
          SOURCE: copilot-instructions.md
          TARGET_PATH: .github/copilot-instructions.md
          COMMIT_MSG: "chore: sync copilot-instructions from .github"
        run: |
          set -euo pipefail
          CONTENT=$(base64 -w0 "$SOURCE")

          gh api "orgs/$ORG/repos" \
            --paginate \
            --jq '.[] | select(.archived == false and .name != ".github") | .name' \
          | while read -r REPO; do
              FULL="${ORG}/${REPO}"

              # Get current file SHA if it exists
              RESPONSE=$(gh api "repos/$FULL/contents/$TARGET_PATH" 2>/dev/null || echo "NOT_FOUND")

              if echo "$RESPONSE" | grep -q '"sha"'; then
                CURRENT_SHA=$(echo "$RESPONSE" | jq -r '.sha')
                CURRENT_CONTENT=$(echo "$RESPONSE" | jq -r '.content' | tr -d '\n')

                # Skip if content is identical
                if [ "$CURRENT_CONTENT" = "$CONTENT" ]; then
                  echo "SKIP $REPO (no changes)"
                  continue
                fi

                gh api --method PUT "repos/$FULL/contents/$TARGET_PATH" \
                  -f message="$COMMIT_MSG" \
                  -f content="$CONTENT" \
                  -f sha="$CURRENT_SHA" \
                  --silent \
                  && echo "UPDATED $REPO" \
                  || echo "FAILED $REPO"
              else
                # File doesn't exist — create it (also creates .github/ if needed)
                gh api --method PUT "repos/$FULL/contents/$TARGET_PATH" \
                  -f message="$COMMIT_MSG" \
                  -f content="$CONTENT" \
                  --silent \
                  && echo "CREATED $REPO" \
                  || echo "FAILED $REPO"
              fi
            done
