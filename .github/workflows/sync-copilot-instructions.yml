name: Sync Copilot Instructions

on:
  push:
    branches: [main]
    paths:
      - copilot-instructions.md
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

jobs:
  sync:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Sync to all org repos
        env:
          GH_TOKEN: ${{ secrets.SYNC_TOKEN }}
          ORG: ${{ github.repository_owner }}
          SOURCE: copilot-instructions.md
          TARGET_PATH: .github/copilot-instructions.md
          BRANCH: chore/sync-copilot-instructions
          COMMIT_MSG: "chore: sync copilot-instructions from .github"
          PR_TITLE: "chore: sync copilot-instructions from .github"
          PR_BODY: "Sincronização automática do arquivo `copilot-instructions.md` a partir do repositório `.github` da organização."
        run: |
          set -euo pipefail
          CONTENT=$(base64 -w0 "$SOURCE")

          gh api "orgs/$ORG/repos" \
            --paginate \
            --jq '.[] | select(.archived == false and .name != ".github") | .name' \
          | while read -r REPO; do
              FULL="${ORG}/${REPO}"

              DEFAULT_BRANCH=$(gh api "repos/$FULL" --jq '.default_branch' 2>/dev/null || echo "main")

              # If sync branch already exists, compare against it (not the default branch)
              if gh api "repos/$FULL/git/ref/heads/$BRANCH" --silent 2>/dev/null; then
                SYNC_RESPONSE=$(gh api "repos/$FULL/contents/$TARGET_PATH?ref=$BRANCH" 2>/dev/null || echo "NOT_FOUND")
                if echo "$SYNC_RESPONSE" | grep -q '"sha"'; then
                  SYNC_CONTENT=$(echo "$SYNC_RESPONSE" | jq -r '.content' | tr -d '\n')
                  if [ "$SYNC_CONTENT" = "$CONTENT" ]; then
                    echo "SKIP   $REPO (PR already up to date)"
                    continue
                  fi
                  FILE_SHA=$(echo "$SYNC_RESPONSE" | jq -r '.sha')
                else
                  FILE_SHA=""
                fi
              else
                # No sync branch yet — check default branch for existing file SHA
                HEAD_SHA=$(gh api "repos/$FULL/git/ref/heads/$DEFAULT_BRANCH" --jq '.object.sha' 2>/dev/null || { echo "FAILED $REPO (no default branch)"; continue; })
                DEFAULT_RESPONSE=$(gh api "repos/$FULL/contents/$TARGET_PATH" 2>/dev/null || echo "NOT_FOUND")
                if echo "$DEFAULT_RESPONSE" | grep -q '"sha"'; then
                  DEFAULT_CONTENT=$(echo "$DEFAULT_RESPONSE" | jq -r '.content' | tr -d '\n')
                  if [ "$DEFAULT_CONTENT" = "$CONTENT" ]; then
                    echo "SKIP   $REPO (no changes)"
                    continue
                  fi
                  FILE_SHA=$(echo "$DEFAULT_RESPONSE" | jq -r '.sha')
                else
                  FILE_SHA=""
                fi
                gh api "repos/$FULL/git/refs" -X POST \
                  -f ref="refs/heads/$BRANCH" \
                  -f sha="$HEAD_SHA" \
                  --silent
              fi

              # Commit file onto sync branch
              if [ -n "$FILE_SHA" ]; then
                gh api "repos/$FULL/contents/$TARGET_PATH" -X PUT \
                  -f message="$COMMIT_MSG" \
                  -f content="$CONTENT" \
                  -f sha="$FILE_SHA" \
                  -f branch="$BRANCH" \
                  --silent
              else
                gh api "repos/$FULL/contents/$TARGET_PATH" -X PUT \
                  -f message="$COMMIT_MSG" \
                  -f content="$CONTENT" \
                  -f branch="$BRANCH" \
                  --silent
              fi

              # Open PR if none exists already
              EXISTING_PR=$(gh api "repos/$FULL/pulls?head=$ORG:$BRANCH&state=open" --jq '.[0].number' 2>/dev/null || echo "")
              if [ -z "$EXISTING_PR" ] || [ "$EXISTING_PR" = "null" ]; then
                gh api "repos/$FULL/pulls" -X POST \
                  -f title="$PR_TITLE" \
                  -f body="$PR_BODY" \
                  -f head="$BRANCH" \
                  -f base="$DEFAULT_BRANCH" \
                  --silent \
                  && echo "PR_OPENED $REPO" \
                  || echo "FAILED    $REPO"
              else
                echo "PR_UPDATED $REPO (#$EXISTING_PR)"
              fi
            done
